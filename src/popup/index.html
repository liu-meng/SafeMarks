<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeMarks</title>
    <link rel="stylesheet" href="../shared/styles.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app-shell popup-shell stack">
      <section class="panel panel-pad popup-header">
        <div class="section-head popup-header-bar">
          <div>
            <p class="eyebrow">SafeMarks</p>
            <h1>加密收藏夹</h1>
          </div>
          <button id="open-settings" class="ghost-button" type="button">设置</button>
        </div>
        <p class="subtitle">popup 只保留解锁、保存当前页和快速查找；完整维护请到管理页。</p>
      </section>

      <p id="global-message" class="message message-info" hidden></p>

      <section id="setup-screen" class="panel panel-pad stack" hidden>
        <div class="stack panel-tight">
          <h2>首次创建保险库</h2>
          <p class="helper-text">创建后会立即加密一个空收藏库；常规保存会直接写入密文，锁定状态下的快速收藏会先本地暂存，待解锁后导入保险库。</p>
        </div>
        <form id="setup-form" class="stack">
          <label class="label">
            <span>主密码</span>
            <input id="setup-password" class="input" type="password" autocomplete="new-password" required />
          </label>
          <label class="label">
            <span>确认主密码</span>
            <input id="setup-confirm" class="input" type="password" autocomplete="new-password" required />
          </label>
          <label class="label">
            <span>自动锁定</span>
            <select id="setup-autolock" class="select">
              <option value="5">5 分钟</option>
              <option value="15" selected>15 分钟</option>
              <option value="30">30 分钟</option>
            </select>
          </label>
          <button class="button" type="submit">创建保险库</button>
        </form>
      </section>

      <section id="locked-screen" class="panel panel-pad stack" hidden>
        <div class="stack panel-tight">
          <h2>保险库已锁定</h2>
          <p id="locked-bookmark-count" class="badge">收藏条数将在首次解锁后同步</p>
          <p class="helper-text">输入主密码后即可查看收藏，并继续保存当前页。</p>
          <p id="locked-quick-capture-status" class="helper-text" hidden></p>
        </div>
        <form id="unlock-form" class="stack">
          <label class="label">
            <span>主密码</span>
            <input id="unlock-password" class="input" type="password" autocomplete="current-password" required />
          </label>
          <button class="button" type="submit">解锁</button>
        </form>
      </section>

      <section id="unlocked-screen" class="stack" hidden>
        <section class="panel panel-pad stack">
          <div class="section-head">
            <div class="stack panel-tight">
              <h2>当前保险库</h2>
              <p id="session-badge" class="badge">已解锁</p>
            </div>
            <button id="lock-now" class="button-secondary" type="button">锁定</button>
          </div>

          <div class="save-entry stack">
            <button id="save-current-page" class="button save-trigger" type="button">
              <span class="save-trigger-content">
                <span id="save-current-page-favicon-shell" class="save-trigger-favicon-shell" hidden>
                  <img
                    id="save-current-page-favicon"
                    class="save-trigger-favicon"
                    alt=""
                    referrerpolicy="no-referrer"
                  />
                </span>
                <span>保存当前页</span>
              </span>
            </button>

            <section id="save-panel" class="save-panel stack" hidden>
              <div class="section-head save-panel-head">
                <div class="stack panel-tight">
                  <h3 id="save-panel-title">新建收藏</h3>
                  <p id="page-status" class="helper-text">正在读取当前页面信息...</p>
                </div>
                <button id="close-save-panel" class="ghost-button save-cancel-button" type="button">取消</button>
              </div>
              <form id="add-form" class="stack">
                <label class="label">
                  <span>标题</span>
                  <input id="bookmark-title" class="input" type="text" required />
                </label>
                <label class="label">
                  <span>URL</span>
                  <input id="bookmark-url" class="input" type="url" required />
                </label>
                <label class="label">
                  <span>分类目录</span>
                  <input
                    id="bookmark-folder-path"
                    class="input"
                    type="text"
                    placeholder="可选，例如 工作/项目A"
                  />
                </label>
                <label class="label">
                  <span>备注</span>
                  <textarea
                    id="bookmark-note"
                    class="textarea"
                    rows="3"
                    placeholder="可选，记录这条收藏的用途或补充信息"
                  ></textarea>
                </label>
                <button id="add-submit" class="button" type="submit">完成</button>
              </form>
            </section>
          </div>
        </section>

        <section class="panel panel-pad stack">
          <div class="section-head">
            <div class="stack panel-tight">
              <h2>收藏列表</h2>
              <p id="bookmark-count" class="helper-text">0 条收藏</p>
            </div>
            <button id="open-manager" class="ghost-button popup-manage-button" type="button">管理收藏</button>
          </div>
          <label class="label">
            <span>搜索收藏</span>
            <input id="search-input" class="input" type="search" placeholder="按标题、URL、目录或备注搜索" />
          </label>
          <div id="empty-state" class="empty-state">还没有收藏，先把当前页加入保险库。</div>
          <ul id="bookmark-list" class="bookmark-list"></ul>
        </section>
      </section>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
