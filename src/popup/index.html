<!doctype html>
<html lang="en" data-i18n-pending="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeMarks</title>
    <link rel="stylesheet" href="../shared/styles.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app-shell popup-shell stack">
      <section class="panel panel-pad popup-header">
        <div class="section-head popup-header-bar">
          <div>
            <p class="eyebrow">SafeMarks</p>
            <h1>加密收藏夹</h1>
          </div>
          <button id="open-settings" class="ghost-button" type="button">设置</button>
        </div>
        <p class="subtitle">在这里解锁、保存当前页和快速查找；整理收藏请到管理页。</p>
      </section>

      <p id="global-message" class="message message-info" hidden></p>

      <div id="changelog-banner" class="changelog-banner message message-info" hidden>
        <span id="changelog-banner-text"></span>
        <button id="changelog-banner-dismiss" class="ghost-button changelog-banner-close" type="button" aria-label="关闭">&times;</button>
      </div>

      <section id="setup-screen" class="panel panel-pad stack" hidden>
        <div class="stack panel-tight">
          <h2>先设置主密码</h2>
          <p class="helper-text">所有数据只保存在当前浏览器，不需要账号或云同步。</p>
          <p class="helper-text">设置完成后就能保存当前页，也可以继续导入现有书签；主密码忘记后无法找回。</p>
        </div>
        <form id="setup-form" class="stack">
          <label class="label">
            <span>主密码</span>
            <input id="setup-password" class="input" type="password" autocomplete="new-password" required />
          </label>
          <label class="label">
            <span>确认主密码</span>
            <input id="setup-confirm" class="input" type="password" autocomplete="new-password" required />
          </label>
          <label class="label">
            <span>密码提示（可选）</span>
            <input id="setup-hint" class="input" type="text" placeholder="帮助你回忆密码的提示，不要写密码本身" />
          </label>
          <label class="label">
            <span>自动锁定</span>
            <select id="setup-autolock" class="select">
              <option value="1">1 分钟</option>
              <option value="5">5 分钟</option>
              <option value="15" selected>15 分钟</option>
              <option value="30">30 分钟</option>
              <option value="0">关闭浏览器时锁定</option>
            </select>
          </label>
          <div class="button-row">
            <button class="button" type="submit">创建保险库</button>
            <button id="open-import-onboarding" class="button-secondary" type="button">导入现有书签</button>
          </div>
        </form>
      </section>

      <section id="locked-screen" class="panel panel-pad stack" hidden>
        <div class="stack panel-tight">
          <h2>保险库已锁定</h2>
          <p id="locked-bookmark-count" class="badge">收藏条数将在首次解锁后同步</p>
          <p class="helper-text">输入主密码后即可查看收藏，并继续保存当前页。</p>
          <p id="locked-hint" class="helper-text" hidden></p>
          <p id="locked-quick-capture-status" class="helper-text" hidden></p>
        </div>
        <form id="unlock-form" class="stack">
          <label class="label">
            <span>主密码</span>
            <input id="unlock-password" class="input" type="password" autocomplete="current-password" required />
          </label>
          <button class="button" type="submit">解锁</button>
        </form>
      </section>

      <section id="unlocked-screen" class="stack" hidden>
        <section class="panel panel-pad stack quick-panel">
          <div class="popup-status-bar">
            <p id="session-badge" class="badge session-badge">已解锁</p>
            <button id="lock-now" class="ghost-button compact-action" type="button">锁定</button>
          </div>

          <div class="save-entry stack">
            <div class="current-page-summary">
              <p class="eyebrow">当前页</p>
              <div class="current-page-main">
                <span id="current-page-favicon-shell" class="current-page-favicon-shell" hidden>
                  <img
                    id="current-page-favicon"
                    class="current-page-favicon"
                    alt=""
                    referrerpolicy="no-referrer"
                  />
                </span>
                <div class="current-page-copy">
                  <h2 id="current-page-title" class="current-page-title">正在读取当前页</h2>
                  <p id="current-page-url" class="current-page-url">打开普通网页后即可保存到保险库。</p>
                </div>
              </div>
              <p id="current-page-folder" class="current-page-folder helper-text" hidden></p>
            </div>
            <button id="save-current-page" class="button save-trigger" type="button">
              <span class="save-trigger-content">
                <span id="save-current-page-favicon-shell" class="save-trigger-favicon-shell" hidden>
                  <img
                    id="save-current-page-favicon"
                    class="save-trigger-favicon"
                    alt=""
                    referrerpolicy="no-referrer"
                  />
                </span>
                <span id="save-current-page-label">保存当前页</span>
              </span>
            </button>

            <section id="save-panel" class="save-panel stack" hidden>
              <div class="section-head save-panel-head">
                <div class="stack panel-tight">
                  <h3 id="save-panel-title">新建收藏</h3>
                  <p id="page-status" class="helper-text">正在读取当前页面信息...</p>
                </div>
                <button id="close-save-panel" class="ghost-button save-cancel-button" type="button">取消</button>
              </div>
              <form id="add-form" class="stack">
                <label class="label">
                  <span>标题</span>
                  <input id="bookmark-title" class="input" type="text" required />
                </label>
                <label class="label">
                  <span>URL</span>
                  <input id="bookmark-url" class="input" type="url" required />
                </label>
                <details id="bookmark-details" class="save-details">
                  <summary>详细信息</summary>
                  <div class="save-details-body stack">
                    <div id="bookmark-folder-picker"></div>
                    <label class="label">
                      <span>备注</span>
                      <textarea
                        id="bookmark-note"
                        class="textarea"
                        rows="3"
                        placeholder="可选，记录这条收藏的用途或补充信息"
                      ></textarea>
                    </label>
                    <div id="bookmark-tags-field"></div>
                  </div>
                </details>
                <button id="add-submit" class="button" type="submit">完成</button>
              </form>
            </section>
          </div>

          <label class="label popup-search">
            <span>搜索收藏</span>
            <input id="search-input" class="input" type="search" placeholder="搜索标题、网址、标签、备注或目录" />
          </label>
        </section>

        <section class="panel panel-pad stack">
          <div class="section-head">
            <div class="stack panel-tight">
              <h2 id="bookmark-list-title">最近收藏</h2>
              <p id="bookmark-count" class="helper-text">0 条收藏</p>
            </div>
            <button id="open-manager" class="ghost-button popup-manage-button" type="button">管理收藏</button>
          </div>
          <div id="empty-state" class="empty-state stack">
            <p id="empty-state-copy">还没有收藏，先把当前页加入保险库。</p>
            <div id="empty-state-actions" class="button-row" hidden>
              <button id="empty-state-import" class="button-secondary" type="button">导入浏览器书签</button>
            </div>
          </div>
          <ul id="bookmark-list" class="bookmark-list"></ul>
        </section>
      </section>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
